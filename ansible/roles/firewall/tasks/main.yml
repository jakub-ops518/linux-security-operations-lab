---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow OpenSSH through UFW
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Set default incoming policy to deny
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable UFW
  community.general.ufw:
    state: enabled
