---
- name: Create monitoring directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/lab-monitoring/prometheus
    - /opt/lab-monitoring/grafana/provisioning/datasources
    - /opt/lab-monitoring/grafana/provisioning/dashboards
    - /opt/lab-monitoring/grafana/dashboards

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /opt/lab-monitoring/prometheus/prometheus.yml
    owner: root
    group: root
    mode: "0644"

- name: Deploy Prometheus alert rules
  ansible.builtin.template:
    src: alert.rules.yml.j2
    dest: /opt/lab-monitoring/prometheus/alert.rules.yml
    owner: root
    group: root
    mode: "0644"

- name: Deploy Grafana Prometheus datasource
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: /opt/lab-monitoring/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: root
    mode: "0644"

- name: Deploy Grafana dashboard provider
  ansible.builtin.template:
    src: grafana-dashboard-provider.yml.j2
    dest: /opt/lab-monitoring/grafana/provisioning/dashboards/dashboard-provider.yml
    owner: root
    group: root
    mode: "0644"

- name: Deploy Linux Node Overview dashboard
  ansible.builtin.template:
    src: linux-node-overview.json.j2
    dest: /opt/lab-monitoring/grafana/dashboards/linux-node-overview.json
    owner: root
    group: root
    mode: "0644"

- name: Deploy monitoring Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/lab-monitoring/docker-compose.yml
    owner: root
    group: root
    mode: "0644"

- name: Allow Prometheus through UFW
  community.general.ufw:
    rule: allow
    port: "9090"
    proto: tcp

- name: Allow Grafana through UFW
  community.general.ufw:
    rule: allow
    port: "3000"
    proto: tcp

- name: Start monitoring stack
  community.docker.docker_compose_v2:
    project_src: /opt/lab-monitoring
    state: present
    recreate: auto
