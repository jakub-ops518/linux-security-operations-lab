name: Repository Validation

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core

      - name: Check tracked files for private material
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking for tracked secret-like files..."
          if git ls-files | grep -E '(^|/)(id_rsa|id_ed25519|\.env|.*\.pem|.*\.key)$'; then
            echo "::error::Potential private key, env file, or key material is tracked."
            exit 1
          fi

          echo "Checking for private lab IPs..."
          if git grep -nE '192\.168\.214\.' -- . ':!ansible/inventory.ini'; then
            echo "::error::Private lab IP found in tracked files."
            exit 1
          fi

          echo "Checking for local workstation paths..."
          if git grep -nE '/home/rat|/mnt/c/Users/Rat|C:\\\\Users\\\\Rat' -- . ':!ansible/inventory.ini'; then
            echo "::error::Local workstation path found in tracked files."
            exit 1
          fi

          echo "Checking for private key contents..."
          if git grep -nE 'BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY' -- . ':!ansible/inventory.ini'; then
            echo "::error::Private key material found in tracked files."
            exit 1
          fi

          echo "Checking for real tenant admin secrets..."
          if git grep -nE 'tenant_admin_portal_secret=[^<[:space:]]|site_alpha_portal_password=[^<[:space:]]|site_beta_portal_password=[^<[:space:]]' -- . ':!ansible/inventory.ini'; then
            echo "::error::Tenant admin secret value found in tracked files."
            exit 1
          fi

          echo "Private material check passed."

      - name: Check Markdown formatting basics
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import sys

          files = []
          if Path("README.md").exists():
              files.append(Path("README.md"))
          if Path("docs").exists():
              files.extend(sorted(Path("docs").rglob("*.md")))

          failed = False

          for path in files:
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines()

              fence_count = sum(1 for line in lines if line.startswith("```"))
              if fence_count % 2 != 0:
                  print(f"::error file={path}::Unbalanced markdown code fences")
                  failed = True

              for number, line in enumerate(lines, start=1):
                  if line.startswith("```") and ' id="' in line:
                      print(f"::error file={path},line={number}::Code fence contains unsupported id attribute")
                      failed = True

          if failed:
              sys.exit(1)

          print("Markdown sanity check passed.")
          PY

      - name: Run Ansible syntax check
        shell: bash
        run: |
          set -euo pipefail

          ansible-playbook \
            -i ansible/inventory.example.ini \
            ansible/site.yml \
            --syntax-check
